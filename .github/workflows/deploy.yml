# Deploy — Build & Push Docker image to GitHub Container Registry (GHCR)
# Triggers on every push to `main` (i.e. after a PR is merged).
#
# The image is tagged with:
#   - ghcr.io/<owner>/<repo>:latest
#   - ghcr.io/<owner>/<repo>:<git-sha>
#
# Runtime env vars (MONGODB_URI, auth secrets) are NOT baked into the image.
# Inject them at deploy time via docker-compose, your orchestrator, or a secrets manager.
#
# ## Required Secrets
# None beyond the built-in GITHUB_TOKEN — GHCR auth uses it automatically.
#
# ## Optional: if you deploy via SSH after the push, add these secrets:
#   DEPLOY_HOST        — SSH hostname or IP of the production server
#   DEPLOY_USER        — SSH username
#   DEPLOY_SSH_KEY     — Private SSH key (Ed25519 recommended)
#   DEPLOY_COMPOSE_DIR — Absolute path to docker-compose.yml on the server

name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write   # Required to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-time placeholders — all real secrets are injected at runtime.
          build-args: |
            NEXTAUTH_URL=http://localhost:3000
            NEXTAUTH_SECRET=build-placeholder
            MONGODB_URI=mongodb://localhost:27017/build
            GOOGLE_CLIENT_ID=placeholder
            GOOGLE_CLIENT_SECRET=placeholder

  # Optional SSH deploy step — uncomment and configure secrets to activate.
