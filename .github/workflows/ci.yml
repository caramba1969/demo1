# CI — Lint & Build
# Runs on every pull request targeting any branch.
# No secrets required — this workflow only builds and lints.
#
# NOTE: There is no test suite in this project (npm test is a no-op).
#       Add a test step here once tests are introduced.

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Dummy values satisfy Next.js build-time env validation.
          # Real values are never needed for a lint/build check.
          MONGODB_URI: mongodb://localhost:27017/ci
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-secret-placeholder
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
